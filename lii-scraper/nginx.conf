# /etc/nginx/sites-available/lii-scraper
# Nginx reverse proxy for the LII scraper service.
# Proxies port 80 → gunicorn on 127.0.0.1:8000.
# Only /health and /search are exposed — everything else returns 404.

server {
    listen 80;
    server_name _;

    # Allow only the two endpoints the app uses
    location = /health {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 10s;
    }

    location = /search {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 60s;

        # Limit request body to 64 KB (queries are small)
        client_max_body_size 64k;
    }

    location = /fetch {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_read_timeout 60s;

        # Limit request body to 4 KB (just a URL)
        client_max_body_size 4k;
    }

    location / {
        return 404;
    }
}
