<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <!-- SOC2 I icon - Shield with checkmark -->
  <g transform="translate(30, 60)">
    <path d="M39 16v-4.2c0-6-4.4-11.1-10.4-11.8C27.3 0 26.2 0 24 0c-2.2 0-3.3 0-4.6.1C13.4.8 9 6 9 11.8V16c-5 0-9 4-9 9v14c0 5 4 9 9 9h30c5 0 9-4 9-9V25c0-5-4-9-9-9z" 
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" from="150, 150" to="150, 0" dur="2s" begin="0s" fill="freeze" />
      <animate attributeName="stroke-dashoffset" from="150" to="0" dur="2s" begin="0s" fill="freeze" />
    </path>
    <path d="M28 25L22 31l-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze" />
      <animate attributeName="stroke-dasharray" from="20, 20" to="20, 0" dur="0.5s" begin="1.5s" fill="freeze" />
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.5s" begin="1.5s" fill="freeze" />
    </path>
  </g>

  <!-- SOC2 II icon - Lock with keyhole -->
  <g transform="translate(150, 60)">
    <circle cx="24" cy="32" r="2" fill="currentColor" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.5s" fill="freeze" />
    </circle>
    <rect x="6" y="20" width="36" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" from="120, 120" to="120, 0" dur="1.5s" begin="0s" fill="freeze" />
      <animate attributeName="stroke-dashoffset" from="120" to="0" dur="1.5s" begin="0s" fill="freeze" />
    </rect>
    <path d="M14 20V14a10 10 0 0 1 20 0v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.2s" fill="freeze" />
      <animate attributeName="stroke-dasharray" from="50, 50" to="50, 0" dur="1s" begin="1.2s" fill="freeze" />
      <animate attributeName="stroke-dashoffset" from="50" to="0" dur="1s" begin="1.2s" fill="freeze" />
    </path>
  </g>

  <!-- Encrypted in Transit icon - Folder with lock -->
  <g transform="translate(270, 60)">
    <rect width="16" height="10" x="28" y="34" rx="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" from="52, 52" to="52, 0" dur="1s" begin="1s" fill="freeze" />
      <animate attributeName="stroke-dashoffset" from="52" to="0" dur="1s" begin="1s" fill="freeze" />
    </rect>
    <path d="M20 40H8a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4h7.8a4 4 0 0 1 3.38 1.8l1.62 2.4a4 4 0 0 0 3.34 1.8H40a4 4 0 0 1 4 4v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" from="120, 120" to="120, 0" dur="1.8s" begin="0s" fill="freeze" />
      <animate attributeName="stroke-dashoffset" from="120" to="0" dur="1.8s" begin="0s" fill="freeze" />
    </path>
    <path d="M40 34v-4a4 4 0 1 0-8 0v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze" />
      <animate attributeName="stroke-dasharray" from="20, 20" to="20, 0" dur="0.8s" begin="1.8s" fill="freeze" />
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.8s" begin="1.8s" fill="freeze" />
    </path>
    <!-- Data particles for encryption visualization -->
    <circle cx="20" cy="20" r="1" fill="currentColor" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="2s" repeatCount="1" />
      <animate attributeName="cx" values="20;40" dur="2s" begin="2s" repeatCount="1" />
      <animate attributeName="cy" values="20;30" dur="2s" begin="2s" repeatCount="1" />
    </circle>
    <circle cx="15" cy="25" r="1" fill="currentColor" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="2.2s" repeatCount="1" />
      <animate attributeName="cx" values="15;35" dur="1.5s" begin="2.2s" repeatCount="1" />
      <animate attributeName="cy" values="25;35" dur="1.5s" begin="2.2s" repeatCount="1" />
    </circle>
  </g>

  <!-- No Training on User Data - Shield with user -->
  <g transform="translate(390, 60)">
    <path d="M40 26c0 10-7 15-15.32 17.9a2 2 0 0 1-1.34-.02C15 41 8 36 8 26V12a2 2 0 0 1 2-2c4 0 9-2.4 12.48-5.44a2.34 2.34 0 0 1 3.04 0C29.02 7.62 34 10 38 10a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" from="150, 150" to="150, 0" dur="2s" begin="0s" fill="freeze" />
      <animate attributeName="stroke-dashoffset" from="150" to="0" dur="2s" begin="0s" fill="freeze" />
    </path>
    <path d="M12.752 37.82a12 12 0 0 1 22.498.006" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze" />
      <animate attributeName="stroke-dasharray" from="30, 30" to="30, 0" dur="0.8s" begin="1.8s" fill="freeze" />
      <animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.8s" begin="1.8s" fill="freeze" />
    </path>
    <circle cx="24" cy="22" r="8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze" />
      <animate attributeName="stroke-dasharray" from="50, 50" to="50, 0" dur="1s" begin="1.5s" fill="freeze" />
      <animate attributeName="stroke-dashoffset" from="50" to="0" dur="1s" begin="1.5s" fill="freeze" />
    </circle>
    <!-- No sign (slash) -->
    <line x1="10" y1="42" x2="38" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.5s" fill="freeze" />
      <animate attributeName="stroke-dasharray" from="50, 50" to="50, 0" dur="0.8s" begin="2.5s" fill="freeze" />
      <animate attributeName="stroke-dashoffset" from="50" to="0" dur="0.8s" begin="2.5s" fill="freeze" />
    </line>
  </g>
</svg>